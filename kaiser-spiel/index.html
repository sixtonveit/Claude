<title>Kaiser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Vom Freiherrn zum Kaiser: Wirtschaftsspiel im Low-Poly-Stil nach dem Klassiker Kaiser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Spiel-UI im Polytopia-Stil: Nachtblau, runde Knöpfe mit Tiefe, Gold für Macht. Bewusst nur dunkles Theme. */
:root{
  --night:#141c2e; --panel:#1f2940; --panel2:#2a3654; --line:#36446a;
  --ink:#f4f1e8; --muted:#a8b2c8; --gold:#f2b53b; --cyan:#3fc3dc; --red:#e9566a; --green:#5fd08a;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font:15px/1.5 var(--body);margin:0;overflow:hidden}
#app{height:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.btn{font:600 15px/1.1 var(--display);border:0;border-radius:99px;padding:11px 16px;color:#13202e;background:var(--cyan);box-shadow:0 4px 0 #2a8ea2;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.btn small{font:700 11px/1 var(--body);opacity:.75}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 #b9832a}
.btn.ghost{background:#3a4868;color:var(--ink);box-shadow:0 4px 0 #26314a}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a33445;color:#fff}
.btn.small{padding:8px 12px;font-size:14px}
.btn.wide{width:100%;padding:14px}
.btn:active:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn{position:relative}
.btn em{position:absolute;top:-4px;right:-2px;width:14px;height:14px;border-radius:50%;background:var(--red);font-size:0;box-shadow:0 0 0 2px var(--night)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:inline-flex;background:var(--panel2);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:99px;font:600 14px/1 var(--display);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--gold);color:#1d2539}
.hint{color:var(--muted);font-size:13px}
.fine{color:var(--muted);font-size:12px;text-align:center}
.pos{color:var(--green)} .neg{color:var(--red)}
.blades{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Start */
.start{height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:center;gap:24px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(120% 90% at 30% 20%,#2a4a7a 0%,var(--night) 70%)}
.start-art .demo{width:100%;height:auto;max-width:640px;display:block;margin:auto;filter:saturate(1.15)}
.start-card{background:var(--panel);border-radius:24px;padding:22px;display:grid;gap:14px;max-width:560px;width:100%}
.start-card h1{font-size:clamp(48px,8vw,80px);color:var(--gold);line-height:1}
.start-card .sub{color:var(--muted)}
.houses{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.house{border:2px solid transparent;background:var(--panel2);border-radius:14px;padding:8px;display:grid;gap:3px;text-align:left;cursor:pointer}
.house i{display:block;height:22px;border-radius:7px;background:linear-gradient(90deg,var(--hc) 50%,color-mix(in srgb,var(--hc) 70%,#000) 50%)}
.house b{font:600 15px/1.1 var(--display)}
.house span{font-size:11px;color:var(--muted);line-height:1.25}
.house.on{border-color:var(--gold);background:#34416a}
.formrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.formrow label{font:600 14px/1 var(--display);color:var(--muted)}
.formrow input{flex:1;min-width:120px;background:var(--panel2);border:0;border-radius:12px;padding:10px 12px;color:var(--ink);font:700 15px var(--body)}
@media (max-width:820px){.start{grid-template-columns:1fr;align-items:start}.start-art .demo{max-width:420px}}

/* Spiel */
.game{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:radial-gradient(130% 100% at 50% 0%,#2b5f8a 0%,#1a3352 55%,var(--night) 100%)}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:max(8px,env(safe-area-inset-top,0px)) 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.badge{display:flex;align-items:center;gap:8px;background:var(--hc);border:0;border-radius:99px;padding:4px 16px 4px 6px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3);min-width:0}
.badge svg{width:36px;height:42px;flex:none}
.badge span{display:grid;text-align:left;min-width:0}
.badge b{font:600 15px/1.15 var(--display);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge small{font:700 12px/1.2 var(--body);color:rgba(255,255,255,.85)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(20,28,46,.85);border-radius:99px;padding:4px 11px 4px 4px;font:800 14px/1 var(--body);font-variant-numeric:tabular-nums}
.chip i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--display);font-style:normal;color:#1d2539}
.mapwrap{min-height:0;position:relative;padding:4px 8px}
#mapwrap{width:100%;height:100%}
#map{width:100%;height:100%;filter:saturate(1.15);display:block;touch-action:none;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:8px;display:grid;gap:6px}
.zoom button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,28,46,.85);font:600 20px/1 var(--display);cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-block:8px max(12px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:linear-gradient(0deg,rgba(20,28,46,.95),rgba(20,28,46,0))}
@media (max-width:560px){.bar .btn{padding:10px 11px;font-size:14px}.chip{font-size:13px}}

/* Dialoge */
.sheet-back{position:fixed;inset:0;background:rgba(8,12,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{position:relative;background:var(--panel);width:min(640px,100%);max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));display:grid;gap:12px;box-shadow:0 -8px 40px rgba(0,0,0,.4)}
#sheetBody{display:grid;gap:14px;min-width:0}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:24px}}
.sheet h2{font-size:26px;padding-right:40px}
.sheet h3{font-size:18px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--panel2);font:600 22px/1 var(--display);cursor:pointer;z-index:1}
.panel{background:var(--panel2);border-radius:16px;padding:14px;display:grid;gap:10px;min-width:0}
.panel p{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.price{font:600 30px/1 var(--display);color:var(--gold);text-align:right;display:grid;font-variant-numeric:tabular-nums}
.price small{font:700 11px/1.2 var(--body);color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold)}
.mood{font:700 13px/1 var(--body);padding:6px 10px;border-radius:99px;background:#1f4a3a;color:#8fe0b4}
.mood.mAufruhr{background:#5e2730;color:#ffb3ba}.mood.mMurren{background:#5a4a20;color:#ffd98a}.mood.mJubel{background:#1f3f5a;color:#9fdcf5}
.ledger{display:grid;grid-template-columns:1fr auto;gap:4px 16px;background:var(--panel2);border-radius:14px;padding:12px 14px;font-variant-numeric:tabular-nums}
.ledger span{color:var(--muted)} .ledger b{text-align:right}
.ledger .sum{border-top:1px solid var(--line);padding-top:6px;color:var(--ink);font-weight:800}
.evs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.ev{margin:0;background:var(--panel2);border-radius:16px;overflow:hidden;display:grid}
.ev svg{display:block;width:100%;height:auto}
.ev figcaption{padding:10px 12px 12px;display:grid;gap:3px}
.ev b{font:600 17px/1.2 var(--display)} .ev span{color:var(--muted);font-size:14px}
.news{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:14px}
.news b{color:var(--gold);font-variant-numeric:tabular-nums}
.warn{background:#4a2530;border-radius:14px;padding:12px;display:grid;gap:8px;justify-items:start}
.builds{display:grid;gap:10px}
.bcard{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--panel2);border-radius:16px;padding:10px;align-items:center}
.bcard svg{width:110px;height:auto}
.bcard div{display:grid;gap:6px;justify-items:start;min-width:0}
.bcard h3 small{color:var(--muted);font:700 13px var(--body)}
.bcard p{color:var(--muted);font-size:13px}
.why{color:#ffb3ba;font-size:12px}
.mini{width:52px;height:74px;flex:none}
.targets{display:grid;gap:8px}
.target{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:8px 10px}
.target i{width:14px;height:14px;border-radius:4px;background:var(--tc)}
.target div{display:grid;min-width:0} .target small{color:var(--muted)}
.tag{font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:99px;background:#1f4a3a;color:#8fe0b4}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--panel2);border-radius:16px;padding:12px;display:grid;justify-items:center;text-align:center;gap:2px}
.pcard svg{width:70px;height:94px}
.pcard small{color:var(--muted);font-size:12px}
.pcard .empty{height:94px;display:grid;place-items:center;font-size:42px;color:var(--line)}
.kids,.offers{display:grid;gap:8px}
.kid,.offer{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--panel2);border-radius:14px;padding:10px;align-items:center}
.kid svg{width:40px;height:48px}.offer svg{width:60px;height:80px}
.kid div,.offer div{display:grid;gap:4px;justify-items:start;min-width:0}
.kid small,.offer small{color:var(--muted)} .offer p{color:var(--muted);font-size:14px}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.ladder div{opacity:.35;display:grid;justify-items:center}
.ladder div.got{opacity:1}.ladder div.next{opacity:.8}
.ladder div.next small{color:var(--gold)}
.ladder svg{width:100%;max-width:56px;height:auto}
.ladder small{font:600 11px/1.1 var(--display)}
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.reqs li::before{content:"○";color:var(--muted);margin-right:8px}
.reqs li.ok{color:var(--green)} .reqs li.ok::before{content:"✓";color:var(--green)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font:700 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
tr.dead{opacity:.45}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.rules{display:grid;gap:8px;color:var(--muted)} .rules b{color:var(--ink)}
.battle{background:linear-gradient(180deg,#8fd0e8,#d6f0f4);border-radius:16px;overflow:hidden}
.battle svg{display:block;width:100%;height:auto}
.battle .sideA,.battle .sideD{transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .6s}
.battle .clash{opacity:0;transition:opacity .2s}
.battle.go .sideA{transform:translateX(90px)} .battle.go .sideD{transform:translateX(-90px)}
.battle.hit .clash{opacity:1}
.battle.done .clash{opacity:0}
.battle.done .loser{opacity:.25}
.battle.done .sideA:not(.loser),.battle.done .sideD:not(.loser){transform:translateX(0)}
.outcome{display:grid;gap:8px;opacity:0;transition:opacity .4s}
.outcome.show{opacity:1}
.outcome h3{font-size:22px} .outcome p{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0d1424;color:var(--ink);padding:10px 16px;border-radius:99px;font:700 14px var(--body);z-index:30;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.end{height:100%;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(100% 80% at 50% 30%,#4a3a7a,var(--night))}
.end svg{width:min(420px,100%);height:auto}
.end h1{font-size:clamp(40px,8vw,64px);color:var(--gold)}
.end p{max-width:46ch;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.blades{animation:none}.battle *{transition:none!important}}
</style>
<div id="app"></div>
<script>/*BUNDLE*/</script>
